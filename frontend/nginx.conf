server {
  listen 5173;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Cache static assets for performance
  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
  }
}
